<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KazBloom — AI Project</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Playfair+Display:ital,wght@0,700;1,700&display=swap');
        :root { --kz-blue: #00afca; --kz-gold: #fec100; --dark: #050a12; }
        body { margin: 0; font-family: 'Montserrat', sans-serif; background-color: var(--dark); color: white; }
        .hero { height: 50vh; background: linear-gradient(rgba(5,10,18,0.8), rgba(5,10,18,0.8)), url('https://images.unsplash.com/photo-1620216447477-70967399f92e?q=80&w=2070&auto=format&fit=crop'); background-size: cover; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .hero h1 { font-size: 5rem; font-family: 'Playfair Display', serif; color: var(--kz-blue); margin: 0; }
        .container { max-width: 1000px; margin: 30px auto; padding: 20px; text-align: center; }
        #bot-widget { position: fixed; bottom: 20px; right: 20px; width: 380px; height: 550px; background: #0a0e17; border: 2px solid var(--kz-blue); border-radius: 20px; display: flex; flex-direction: column; box-shadow: 0 15px 40px rgba(0,0,0,0.7); }
        #bot-msgs { flex: 1; padding: 20px; overflow-y: auto; font-size: 0.95rem; line-height: 1.5; }
        .bot-msg { background: #1a1a1a; padding: 12px; border-radius: 12px; margin-bottom: 12px; border-left: 4px solid var(--kz-blue); }
        .user-msg { text-align: right; color: var(--kz-gold); margin-bottom: 12px; font-weight: bold; }
        #bot-input-area { padding: 15px; display: flex; gap: 10px; background: #000; border-radius: 0 0 20px 20px; }
        #bot-input { flex: 1; background: #1a1a1a; border: 1px solid #333; color: white; padding: 12px; border-radius: 8px; outline: none; }
        button { background: var(--kz-gold); border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        button:hover { background: #e0ac00; transform: scale(1.05); }
    </style>
</head>
<body>

<div class="hero">
    <h1>KazBloom</h1>
    <p style="color:var(--kz-gold); letter-spacing: 5px;">AI INTEGRATED SYSTEM</p>
</div>

<div class="container">
    <h2 style="color:var(--kz-blue)">Arnur & Aruzhan Project</h2>
    <p>Бұл платформа нағыз жасанды интеллект (Gemini AI) арқылы жұмыс істейді. Кез келген сұраққа жауап ала аласыз.</p>
</div>

<div id="bot-widget">
    <div style="background:var(--kz-blue); color:black; padding:15px; font-weight:bold; border-radius:18px 18px 0 0; display: flex; justify-content: space-between;">
        <span>KazBloom AI Assistant</span>
    </div>
    <div id="bot-msgs">
        <div class="bot-msg">Сәлем! Мен дайынмын. Маған сұрағыңды қой!</div>
    </div>
    <div id="bot-input-area">
        <input type="text" id="bot-input" placeholder="Сұрақ жазыңыз...">
        <button onclick="askAI()">OK</button>
    </div>
</div>

<script>
    // Жаңартылған API сілтемесі мен нұсқасы
    const API_KEY = "AIzaSyCxKYiP7zsc6-4YD_04x_1U6AV8iycrAks"; 

    async function askAI() {
        const input = document.getElementById('bot-input');
        const msgs = document.getElementById('bot-msgs');
        const userText = input.value.trim();

        if (!userText) return;

        // Пайдаланушы мәтінін көрсету
        msgs.innerHTML += `<div class="user-msg">Сіз: ${userText}</div>`;
        input.value = "";
        
        const loadingId = "load-" + Date.now();
        msgs.innerHTML += `<div id="${loadingId}" style="color:var(--kz-gold); font-size:0.8rem; margin-bottom:15px; animation: pulse 1s infinite;">AI жауап жазуда...</div>`;
        msgs.scrollTop = msgs.scrollHeight;

        try {
            // v1beta емес, тұрақты v1 нұсқасын қолданамыз
            const response = await fetch(`https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: `Пайдаланушыға қазақ тілінде сыпайы жауап бер: ${userText}` }] }]
                })
            });

            const data = await response.json();
            
            const loadEl = document.getElementById(loadingId);
            if(loadEl) loadEl.remove();

            if (data.candidates && data.candidates[0].content) {
                const answer = data.candidates[0].content.parts[0].text;
                msgs.innerHTML += `<div class="bot-msg"><b>AI:</b> ${answer}</div>`;
            } else if (data.error) {
                msgs.innerHTML += `<div class="bot-msg" style="color:red">API Қатесі: ${data.error.message}</div>`;
            } else {
                msgs.innerHTML += `<div class="bot-msg" style="color:red">Жауап бос келді. Басқаша сұрап көріңіз.</div>`;
            }
        } catch (e) {
            const loadEl = document.getElementById(loadingId);
            if(loadEl) loadEl.remove();
            msgs.innerHTML += `<div class="bot-msg" style="color:red">Байланыс қатесі: Интернетті тексеріңіз.</div>`;
        }
        msgs.scrollTop = msgs.scrollHeight;
    }

    document.getElementById('bot-input').addEventListener('keypress', (e) => { if(e.key === 'Enter') askAI(); });
</script>

<style>
@keyframes pulse {
    0% { opacity: 0.5; }
    50% { opacity: 1; }
    100% { opacity: 0.5; }
}
</style>

</body>
</html>
