        /* ================================================================
           1. GLOBAL RESET & VARIABLES
           ================================================================
        */
        :root {
            --color-gold: #D4AF37;
            --color-gold-light: #F4C430;
            --color-blue: #002F6C;
            --color-blue-light: #00509d;
            --color-bg-dark: #0a0a0a;
            --color-bg-card: #141414;
            --color-text-main: #e0e0e0;
            --color-text-muted: #a0a0a0;
            --font-main: 'Montserrat', sans-serif;
            --font-title: 'Cinzel', serif;
            --transition-speed: 0.4s;
        }

        * {
            margin-top: 0;
            margin-bottom: 0;
            margin-left: 0;
            margin-right: 0;
            padding-top: 0;
            padding-bottom: 0;
            padding-left: 0;
            padding-right: 0;
            box-sizing: border-box;
            outline: none;
        }

        body {
            background-color: var(--color-bg-dark);
            color: var(--color-text-main);
            font-family: var(--font-main);
            line-height: 1.6;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* ================================================================
           2. WELCOME SCREEN (OVERLAY)
           ================================================================
        */
        #welcome-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 1s ease-in-out;
        }

        .welcome-content {
            text-align: center;
            padding: 40px;
            border: 1px solid var(--color-gold);
            max-width: 800px;
        }

        .welcome-title {
            font-family: var(--font-title);
            font-size: 4rem;
            color: var(--color-gold);
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 5px;
        }

        .welcome-subtitle {
            font-family: var(--font-main);
            font-size: 1.2rem;
            color: var(--color-text-muted);
            margin-bottom: 40px;
            letter-spacing: 2px;
        }

        .btn-enter {
            background-color: transparent;
            border: 2px solid var(--color-gold);
            color: var(--color-gold);
            padding-top: 15px;
            padding-bottom: 15px;
            padding-left: 50px;
            padding-right: 50px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .btn-enter:hover {
            background-color: var(--color-gold);
            color: #000;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.5);
        }

        /* ================================================================
           3. HEADER SECTION
           ================================================================
        */
        header {
            background-color: rgba(10, 10, 10, 0.95);
            border-bottom: 1px solid #333;
            padding-top: 20px;
            padding-bottom: 20px;
            padding-left: 5%;
            padding-right: 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .brand-logo {
            font-family: var(--font-title);
            font-size: 2rem;
            color: var(--color-gold);
            font-weight: 900;
        }

        .lang-switch {
            display: flex;
            gap: 15px;
        }

        .btn-lang {
            background: none;
            border: 1px solid #555;
            color: #fff;
            padding: 5px 15px;
            cursor: pointer;
            font-family: var(--font-main);
            font-weight: 600;
        }

        .btn-lang.active {
            background-color: var(--color-gold);
            color: #000;
            border-color: var(--color-gold);
        }

        /* ================================================================
           4. SEARCH & HERO
           ================================================================
        */
        .hero-section {
            padding-top: 80px;
            padding-bottom: 40px;
            text-align: center;
        }

        .search-container {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding-top: 20px;
            padding-bottom: 20px;
            padding-left: 30px;
            padding-right: 30px;
            font-size: 1.2rem;
            background-color: #1a1a1a;
            border: 2px solid #333;
            color: #fff;
            border-radius: 50px;
            transition: border-color 0.3s ease;
        }

        .search-input:focus {
            border-color: var(--color-gold);
        }

        /* ================================================================
           5. MAIN GRID LAYOUT
           ================================================================
        */
        .archive-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 30px;
            padding-top: 50px;
            padding-bottom: 100px;
            padding-left: 5%;
            padding-right: 5%;
        }

        .card {
            background-color: var(--color-bg-card);
            border: 1px solid #222;
            border-radius: 8px;
            padding: 30px;
            transition: transform 0.3s ease, border-color 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-10px);
            border-color: var(--color-gold);
        }

        .card-category {
            font-size: 0.8rem;
            color: var(--color-gold);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .card-title {
            font-family: var(--font-title);
            font-size: 1.8rem;
            margin-bottom: 15px;
            color: #fff;
        }

        .card-preview {
            font-size: 0.95rem;
            color: var(--color-text-muted);
            line-height: 1.6;
        }

            left: 0;

            display: none;

            max-width: 1000px;
            margin-top: 50px;
            margin-bottom: 50px;
            margin-left: auto;
            margin-right: auto;
            padding: 40px;
            background-color: #111;
            border: 1px solid #333;
            position: relative;
        }

        .close-modal {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 3rem;
            color: var(--color-gold);
            cursor: pointer;
            line-height: 0.5;
        }

        .modal-header h2 {
            font-family: var(--font-title);
            font-size: 3rem;
            color: var(--color-gold);
            margin-bottom: 20px;
            border-bottom: 1px solid #333;
            padding-bottom: 20px;
        }

        .modal-body {
            font-size: 1.1rem;
            line-height: 1.8;
        }

        .work-section {
            margin-top: 40px;
            padding: 30px;
            background-color: #0f0f0f;
            border-left: 4px solid var(--color-gold);
        }

        .work-title {
            font-family: var(--font-title);
            font-size: 1.5rem;
            color: #fff;
            margin-bottom: 20px;
        }

        .work-text {
            font-family: serif;
            font-style: italic;
            color: #ccc;
            white-space: pre-wrap;

        .bot-trigger {

            right: 30px;

            height: 70px;
            background-color: var(--color-gold);
            border-radius: 50%;

            justify-content: center;

        .bot-header {
            background-color: var(--color-gold);
            padding: 15px;
            color: #000;
            font-weight: 800;
            text-align: center;
        }

        .bot-messages {

            gap: 15px;

            flex: 1;

            background-color: #000;
            border: 1px solid #333;
            color: #fff;
            border-radius: 5px;

        /*

        let currentLang = 'kz';

        function enterSite() {
            const overlay = document.getElementById('welcome-overlay');
            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.style.display = 'none';
            }, 1000);
            renderGrid(database);
        }

        function setLanguage(lang) {
            currentLang = lang;
            document.querySelectorAll('.btn-lang').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderGrid(database);
        }

        function renderGrid(data) {
            const grid = document.getElementById('gridContainer');
            grid.innerHTML = '';

            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => openModal(item.id);

                const name = currentLang === 'kz' ? item.name_kz : item.name_en;
                const bio = currentLang === 'kz' ? item.bio_kz : item.bio_en;
                const bioShort = bio.length > 100 ? bio.substring(0, 100) + '...' : bio;

                card.innerHTML = `
                    <div class="card-category">${item.category}</div>
                    <h3 class="card-title">${name}</h3>
                    <p class="card-preview">${bioShort}</p>
                `;
                grid.appendChild(card);
            });
        }

        function openModal(id) {
            const item = database.find(i => i.id === id);
            const modal = document.getElementById('infoModal');
            const container = document.getElementById('modalData');

            const name = currentLang === 'kz' ? item.name_kz : item.name_en;
            const bio = currentLang === 'kz' ? item.bio_kz : item.bio_en;

            container.innerHTML = `
                <div class="modal-header">
                    <h2>${name}</h2>
                </div>
                <div class="modal-body">
                    <p>${bio}</p>
                    <div class="work-section">
                        <h4 class="work-title">${item.work_title}</h4>
                        <div class="work-text">${item.work_text}</div>
                    </div>
                </div>
            `;
            modal.style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('infoModal').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        function performSearch() {
            const query = document.getElementById('mainSearch').value.toLowerCase();
            const filtered = database.filter(item => 
                item.name_kz.toLowerCase().includes(query) || 
                item.name_en.toLowerCase().includes(query)
            );
            renderGrid(filtered);
        }

        // --- BOT LOGIC ---
        function toggleBot() {
            const win = document.getElementById('botWindow');
            win.style.display = win.style.display === 'flex' ? 'none' : 'flex';
        }

        function askBot() {
            const input = document.getElementById('botInput');
            const msgs = document.getElementById('botMessages');
            const txt = input.value.trim().toLowerCase();
            
            if(!txt) return;

            // User msg
            const uDiv = document.createElement('div');
            uDiv.className = 'msg user';
            uDiv.innerText = input.value;
            msgs.appendChild(uDiv);

            // Bot logic
            let reply = "Кешіріңіз, мұндай мәлімет базада табылмады.";
            
            // Simple keyword search in DB
            const found = database.find(i => 
                txt.includes(i.name_kz.toLowerCase()) || 
                txt.includes(i.name_kz.split(' ')[0].toLowerCase())
            );

            if(found) {
                reply = `${found.name_kz} — ${found.bio_kz}. Оның "${found.work_title}" деген еңбегі бар.`;
            } else if (txt.includes("сәлем") || txt.includes("hello")) {
                reply = "Сәлем! Қазақ тарихы туралы не білгіңіз келеді?";
            }

            setTimeout(() => {
                const bDiv = document.createElement('div');
                bDiv.className = 'msg bot';
                bDiv.innerText = reply;
                msgs.appendChild(bDiv);
                msgs.scrollTop = msgs.scrollHeight;
            }, 500);

            input.value = '';
        }
