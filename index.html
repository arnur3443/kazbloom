<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KazBloom AI — Final Fix</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap');
        :root { --kz-blue: #00afca; --kz-gold: #fec100; --dark: #050a12; }
        body { margin: 0; font-family: 'Montserrat', sans-serif; background-color: var(--dark); color: white; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #chat-container { width: 400px; height: 600px; background: #0a0e17; border: 2px solid var(--kz-blue); border-radius: 20px; display: flex; flex-direction: column; overflow: hidden; }
        #messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px 15px; border-radius: 12px; max-width: 80%; font-size: 0.9rem; line-height: 1.4; }
        .bot { background: #1a1a1a; align-self: flex-start; border-left: 3px solid var(--kz-blue); }
        .user { background: var(--kz-gold); color: black; align-self: flex-end; font-weight: bold; }
        #input-area { padding: 15px; background: #000; display: flex; gap: 10px; }
        input { flex: 1; background: #1a1a1a; border: 1px solid #333; color: white; padding: 10px; border-radius: 8px; outline: none; }
        button { background: var(--kz-blue); border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div id="chat-container">
    <div style="background:var(--kz-blue); color:black; padding:15px; font-weight:bold; text-align:center;">KazBloom AI Assistant</div>
    <div id="messages">
        <div class="msg bot">Сәлем! Сұрағыңызды жазыңыз, мен бірнеше AI моделін кезекпен тексеріп, жауап тауып беремін.</div>
    </div>
    <div id="input-area">
        <input type="text" id="user-input" placeholder="Сұрақ жазыңыз...">
        <button onclick="askAI()">OK</button>
    </div>
</div>

<script>
    const API_KEY = "AIzaSyDqEKFRiWMiYKrmqvAUCItHUEkhpCkmvls";
    
    // Біз тексеріп көретін модельдер тізімі
    const models = [
        "gemini-1.5-flash-latest",
        "gemini-1.5-flash",
        "gemini-pro",
        "gemini-1.0-pro"
    ];

    async function askAI() {
        const input = document.getElementById('user-input');
        const content = document.getElementById('messages');
        const text = input.value.trim();
        if (!text) return;

        content.innerHTML += `<div class="msg user">${text}</div>`;
        input.value = "";
        content.scrollTop = content.scrollHeight;

        let success = false;

        // Әр модельді кезекпен тексеру
        for (let modelName of models) {
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${API_KEY}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `Жауапты қазақша бер: ${text}` }] }]
                    })
                });

                const data = await response.json();

                if (data.candidates && data.candidates[0].content) {
                    const aiText = data.candidates[0].content.parts[0].text;
                    content.innerHTML += `<div class="msg bot"><b>AI (${modelName}):</b> ${aiText}</div>`;
                    success = true;
                    break; // Жауап алынса, циклды тоқтату
                } else {
                    console.log(`${modelName} табылмады, келесіні тексеруде...`);
                }
            } catch (e) {
                console.error(`Error with ${modelName}:`, e);
            }
        }

        if (!success) {
            content.innerHTML += `<div class="msg bot" style="border-color:red">Кешіріңіз, ешбір модель жауап бермеді. API кілтін Google AI Studio-дан қайта тексеріңіз.</div>`;
        }
        content.scrollTop = content.scrollHeight;
    }

    document.getElementById('user-input').addEventListener('keypress', (e) => { if (e.key === 'Enter') askAI(); });
</script>

</body>
</html>
