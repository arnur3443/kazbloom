<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KazBloom — Digital Heritage Project</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Playfair+Display:ital,wght@0,700;1,700&display=swap');

        :root {
            --kz-blue: #00afca;
            --kz-gold: #fec100;
            --dark: #050a12;
            --glass: rgba(255, 255, 255, 0.05);
        }

        body { 
            margin: 0; font-family: 'Montserrat', sans-serif; 
            background-color: var(--dark); color: white; scroll-behavior: smooth;
        }

        /* Hero Section - Нағыз Қазақстан Туы мен Стилистикасы */
        .hero {
            height: 100vh;
            background: linear-gradient(rgba(5, 10, 18, 0.6), rgba(5, 10, 18, 0.9)),
                        url('https://images.unsplash.com/photo-1620216447477-70967399f92e?q=80&w=2070&auto=format&fit=crop'); /* Kazakh Flag / Steppe Style */
            background-size: cover; background-position: center; background-attachment: fixed;
            display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
        }

        .hero h1 { 
            font-size: 7rem; margin: 0; font-family: 'Playfair Display', serif; 
            color: var(--kz-blue); text-shadow: 0 0 20px rgba(0, 175, 202, 0.5);
        }

        .hero p { font-size: 1.2rem; letter-spacing: 8px; color: var(--kz-gold); font-weight: bold; }

        /* Figures Section */
        .container { max-width: 1200px; margin: 0 auto; padding: 100px 20px; }

        .section-header { text-align: center; margin-bottom: 60px; border-bottom: 2px solid var(--kz-gold); display: inline-block; width: 100%; padding-bottom: 20px; }
        .section-header h2 { font-size: 3rem; color: var(--kz-blue); margin: 0; }

        .figures-grid { 
            display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 30px; 
        }

        .figure-card {
            background: var(--glass); backdrop-filter: blur(15px);
            border-radius: 20px; border: 1px solid rgba(0, 175, 202, 0.3);
            overflow: hidden; transition: 0.5s;
        }

        .figure-card:hover { transform: scale(1.03); border-color: var(--kz-gold); box-shadow: 0 0 30px rgba(254, 193, 0, 0.2); }

        .figure-info { padding: 25px; }
        .figure-info h3 { margin: 0; color: var(--kz-gold); font-size: 1.4rem; }
        .figure-years { font-size: 0.8rem; color: var(--kz-blue); margin-bottom: 10px; }

        .lang-split { margin-top: 15px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px; }
        .lang-item { margin-bottom: 15px; font-size: 0.9rem; line-height: 1.6; }
        .tag { background: var(--kz-blue); color: black; padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; margin-right: 10px; }

        /* Chat Bot Widget Style */
        #bot-widget {
            position: fixed; bottom: 30px; right: 30px; width: 350px; height: 500px;
            background: #1a1f2b; border: 2px solid var(--kz-gold); border-radius: 20px;
            display: none; flex-direction: column; z-index: 1000; box-shadow: 0 10px 50px rgba(0,0,0,0.5);
        }

        #bot-header { background: var(--kz-gold); color: black; padding: 15px; border-radius: 15px 15px 0 0; font-weight: bold; display: flex; justify-content: space-between; }
        #bot-messages { flex: 1; padding: 15px; overflow-y: auto; font-size: 0.9rem; }
        #bot-input-area { display: flex; padding: 10px; border-top: 1px solid #333; }
        #bot-input { flex: 1; background: #222; border: none; color: white; padding: 10px; border-radius: 5px; }
        
        #bot-trigger {
            position: fixed; bottom: 30px; right: 30px; width: 70px; height: 70px;
            background: var(--kz-gold); border-radius: 50%; cursor: pointer;
            display: flex; justify-content: center; align-items: center; font-size: 2rem;
            box-shadow: 0 0 20px var(--kz-gold); z-index: 999;
        }

        footer { text-align: center; padding: 50px; background: #02050a; color: gray; }
    </style>
</head>
<body>

<div class="hero">
    <div style="border: 2px solid var(--kz-gold); padding: 5px 25px; border-radius: 50px; color: var(--kz-gold); font-weight: bold; margin-bottom: 20px;">DIGITAL PROJECT 2025</div>
    <h1>KazBloom</h1>
    <p>МӘДЕНИ-ТАРИХИ ЦИФРЛЫҚ ПЛАТФОРМА</p>
    <div style="margin-top: 40px; border-left: 3px solid var(--kz-gold); padding-left: 20px; text-align: left;">
        <span style="color: var(--kz-blue);">Authors:</span><br>
        <strong>Khasenov Arnur</strong><br>
        <strong>Adibay Aruzhan</strong>
    </div>
</div>

<div class="container">
    <div class="section-header">
        <h2>Great Figures</h2>
    </div>

    <div class="figures-grid" id="figures-grid">
        </div>
</div>

<div id="bot-trigger" onclick="document.getElementById('bot-widget').style.display='flex'">🤖</div>

<div id="bot-widget">
    <div id="bot-header">
        KazBloom AI Assistant
        <span style="cursor:pointer" onclick="document.getElementById('bot-widget').style.display='none'">✕</span>
    </div>
    <div id="bot-messages">
        <div style="background: var(--kz-blue); padding: 10px; border-radius: 10px; color: black; margin-bottom: 10px;">
            Сәлем! Мен KazBloom көмекшісімін. Қандай тұлға немесе дәстүр туралы білгіңіз келеді?
        </div>
    </div>
    <div id="bot-input-area">
        <input type="text" id="bot-input" placeholder="Сұрақ қойыңыз...">
        <button onclick="sendMessage()" style="background: var(--kz-gold); border:none; padding: 10px; margin-left:5px; border-radius:5px; cursor:pointer">Send</button>
    </div>
</div>

<footer>
    <p>© 2025 KazBloom Project | Arnur & Aruzhan</p>
</footer>

<script>
    const figures = [
        { name: "ABAI QUNANBAIULY", years: "1845–1904", kz: "Қазақтың ұлы ақыны, ойшылы. Қазақ жазба әдебиетінің негізін қалаушы.", en: "The greatest Kazakh poet and philosopher. Founder of written literature." },
        { name: "ABLAI KHAN", years: "1711–1781", kz: "Ұлы мемлекет қайраткері, қолбасшы. Жоңғар шапқыншылығы кезінде елді біріктірді.", en: "A great statesman and leader who united the Kazakh people." },
        { name: "AKHMET BAITURSYNULY", years: "1872–1937", kz: "Ұлт ұстазы, лингвист. Қазақ әліпбиін реформалап, тіл білімінің негізін салды.", en: "The nation's teacher and linguist. Reformed the Kazakh alphabet." },
        { name: "MUSTAFA SHOKAI", years: "1890–1941", kz: "Түркістан тәуелсіздігі үшін күрескен саяси қайраткер.", en: "Political leader who fought for the independence of Turkestan." }
        // Бұл жерге сен жіберген барлық 30 тұлғаны қосуға болады
    ];

    const grid = document.getElementById('figures-grid');
    figures.forEach(f => {
        grid.innerHTML += `
            <div class="figure-card">
                <div style="height:200px; background: linear-gradient(45deg, #050a12, #004c5a); display:flex; align-items:center; justify-content:center; font-size:3rem; opacity:0.5">🇰🇿</div>
                <div class="figure-info">
                    <div class="figure-years">${f.years}</div>
                    <h3>${f.name}</h3>
                    <div class="lang-split">
                        <div class="lang-item"><span class="tag">KZ</span>${f.kz}</div>
                        <div class="lang-item"><span class="tag">EN</span>${f.en}</div>
                    </div>
                </div>
            </div>
        `;
    });

    function sendMessage() {
        const input = document.getElementById('bot-input');
        const msgs = document.getElementById('bot-messages');
        if(!input.value) return;

        msgs.innerHTML += `<div style="text-align:right; margin-bottom:10px; color:var(--kz-gold)">${input.value}</div>`;
        
        let reply = "Кешіріңіз, мен әзірге тек Абай, Абылай хан және Ахмет Байтұрсынұлы туралы білемін. Сұрағыңызды нақтылаңыз.";
        if(input.value.toLowerCase().includes("абай")) reply = "Абай Құнанбайұлы (1845–1904) — қазақтың бас ақыны. Ол туралы толық мәлімет жоғарыдағы карточкада бар.";
        
        setTimeout(() => {
            msgs.innerHTML += `<div style="background:#2c3440; padding:10px; border-radius:10px; margin-bottom:10px;">${reply}</div>`;
            msgs.scrollTop = msgs.scrollHeight;
        }, 500);
        
        input.value = "";
    }
</script>

</body>
</html>
