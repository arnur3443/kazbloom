<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KazBloom — AI Project</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Playfair+Display:ital,wght@0,700;1,700&display=swap');
        :root { --kz-blue: #00afca; --kz-gold: #fec100; --dark: #050a12; }
        body { margin: 0; font-family: 'Montserrat', sans-serif; background-color: var(--dark); color: white; }
        .hero { height: 60vh; background: linear-gradient(rgba(5,10,18,0.8), rgba(5,10,18,0.8)), url('https://images.unsplash.com/photo-1620216447477-70967399f92e?q=80&w=2070&auto=format&fit=crop'); background-size: cover; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .hero h1 { font-size: 5rem; font-family: 'Playfair Display', serif; color: var(--kz-blue); margin: 0; }
        .container { max-width: 1000px; margin: 50px auto; padding: 20px; }
        #bot-widget { position: fixed; bottom: 20px; right: 20px; width: 350px; height: 500px; background: #0a0e17; border: 2px solid var(--kz-blue); border-radius: 15px; display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        #bot-msgs { flex: 1; padding: 15px; overflow-y: auto; font-size: 0.9rem; }
        .bot-msg { background: #1a1a1a; padding: 10px; border-radius: 10px; margin-bottom: 10px; border-left: 3px solid var(--kz-blue); }
        .user-msg { text-align: right; color: var(--kz-gold); margin-bottom: 10px; }
        #bot-input-area { padding: 10px; display: flex; gap: 5px; background: #000; border-radius: 0 0 15px 15px; }
        #bot-input { flex: 1; background: #222; border: 1px solid #333; color: white; padding: 10px; border-radius: 5px; }
        button { background: var(--kz-gold); border: none; padding: 10px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="hero">
    <h1>KazBloom</h1>
    <p style="color:var(--kz-gold)">DIGITAL AI PROJECT</p>
</div>

<div class="container">
    <h2 style="color:var(--kz-blue)">Жоба туралы</h2>
    <p>Бұл Арнур мен Аружанның Google Gemini AI негізінде жасалған интеллектуалды жобасы.</p>
</div>

<div id="bot-widget">
    <div style="background:var(--kz-blue); color:black; padding:10px; font-weight:bold; border-radius:12px 12px 0 0;">KazBloom AI Chat</div>
    <div id="bot-msgs">
        <div class="bot-msg">Сәлем! Сұрағыңды жаз, мен Google AI арқылы жауап беремін.</div>
    </div>
    <div id="bot-input-area">
        <input type="text" id="bot-input" placeholder="Сұрақ жазыңыз...">
        <button onclick="askAI()">OK</button>
    </div>
</div>

<script>
    const API_KEY = "AIzaSyCxKYiP7zsc6-4YD_04x_1U6AV8iycrAks"; 

    async function askAI() {
        const input = document.getElementById('bot-input');
        const msgs = document.getElementById('bot-msgs');
        const userText = input.value.trim();

        if (!userText) return;

        msgs.innerHTML += `<div class="user-msg"><b>Сіз:</b> ${userText}</div>`;
        input.value = "";
        
        const loadingId = "load-" + Date.now();
        msgs.innerHTML += `<div id="${loadingId}" style="color:gray; font-size:0.8rem; margin-bottom:10px;">AI ойлануда...</div>`;
        msgs.scrollTop = msgs.scrollHeight;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: userText }] }]
                })
            });

            const data = await response.json();
            document.getElementById(loadingId).remove();

            if (data.candidates && data.candidates[0].content) {
                const answer = data.candidates[0].content.parts[0].text;
                msgs.innerHTML += `<div class="bot-msg"><b>AI:</b> ${answer}</div>`;
            } else if (data.error) {
                msgs.innerHTML += `<div class="bot-msg" style="color:red">Google API Қатесі: ${data.error.message}</div>`;
            } else {
                msgs.innerHTML += `<div class="bot-msg" style="color:red">Түсініксіз қате. Мүмкін API лимиті біткен.</div>`;
            }
        } catch (e) {
            document.getElementById(loadingId).remove();
            msgs.innerHTML += `<div class="bot-msg" style="color:red">Байланыс қатесі: Интернетті немесе API кілтті тексеріңіз.</div>`;
        }
        msgs.scrollTop = msgs.scrollHeight;
    }

    document.getElementById('bot-input').addEventListener('keypress', (e) => { if(e.key === 'Enter') askAI(); });
</script>

</body>
</html>
