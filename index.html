<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAZBLOOM: ҰЛЫ ДАЛА МҰРАСЫ</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Montserrat:wght@300;400;500;600;800&display=swap" rel="stylesheet">
    
    <style>
        /* ================================================================
           1. CORE STYLES & RESET
           ================================================================
        */
        :root {
            --gold: #D4AF37;
            --gold-dark: #aa8c2c;
            --bg-dark: #050505;
            --bg-panel: #111111;
            --bg-card: #161616;
            --text-main: #f0f0f0;
            --text-dim: #888888;
            --accent-blue: #2c3e50;
            --font-title: 'Playfair Display', serif;
            --font-body: 'Montserrat', sans-serif;
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-body);
            overflow-x: hidden;
        }

        /* SCROLLBAR */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 4px; }

        /* ================================================================
           2. WELCOME SCREEN (ARNUR & ARUZHAN)
           ================================================================
        */
        #intro-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
            background: black; z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center;
            transition: transform 1s ease-in-out;
        }

        .intro-title {
            font-family: var(--font-title); font-size: 5rem; color: var(--gold);
            text-transform: uppercase; letter-spacing: 5px;
            margin-bottom: 20px; animation: slideDown 1s ease;
        }

        .intro-names {
            font-size: 1.5rem; color: #fff; letter-spacing: 3px;
            margin-bottom: 50px; font-weight: 300;
            animation: fadeIn 2s ease;
        }

        .btn-start {
            padding: 15px 50px; border: 2px solid var(--gold);
            background: transparent; color: var(--gold);
            font-size: 1.2rem; cursor: pointer; text-transform: uppercase;
            letter-spacing: 2px; transition: 0.3s;
            animation: zoomIn 1s ease;
        }
        .btn-start:hover { background: var(--gold); color: #000; box-shadow: 0 0 30px var(--gold); }

        @keyframes slideDown { from {transform: translateY(-50px); opacity: 0;} to {transform: translateY(0); opacity: 1;} }
        @keyframes fadeIn { from {opacity: 0;} to {opacity: 1;} }
        @keyframes zoomIn { from {transform: scale(0.8); opacity: 0;} to {transform: scale(1); opacity: 1;} }

        /* ================================================================
           3. MAIN LAYOUT
           ================================================================
        */
        header {
            padding: 30px 5%; display: flex; justify-content: space-between; align-items: center;
            background: rgba(0,0,0,0.8); border-bottom: 1px solid #333; position: sticky; top: 0; z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .logo { font-family: var(--font-title); font-size: 2rem; font-weight: 900; color: #fff; }
        .logo span { color: var(--gold); }

        .search-area {
            padding: 60px 5%; text-align: center; background: radial-gradient(circle, #1a1a1a 0%, #050505 100%);
        }
        .search-box {
            width: 100%; max-width: 700px; padding: 20px 30px; font-size: 1.2rem;
            background: #000; border: 1px solid #333; color: #fff; border-radius: 50px;
            transition: 0.3s;
        }
        .search-box:focus { border-color: var(--gold); outline: none; box-shadow: 0 0 20px rgba(212,175,55,0.2); }

        .filters {
            display: flex; justify-content: center; flex-wrap: wrap; gap: 15px; margin-top: 30px;
        }
        .filter-btn {
            background: #111; border: 1px solid #333; color: #aaa; padding: 10px 20px;
            cursor: pointer; transition: 0.3s; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px;
        }
        .filter-btn.active, .filter-btn:hover { background: var(--gold); color: #000; border-color: var(--gold); }

        /* GRID */
        .archive-container {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px; padding: 40px 5%;
        }

        .card {
            background: var(--bg-card); border: 1px solid #222; padding: 30px;
            border-radius: 10px; position: relative; overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer; display: flex; flex-direction: column;
        }
        .card:hover { transform: translateY(-5px); border-color: var(--gold-dark); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        .card-cat { color: var(--gold); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; }
        .card-name { font-family: var(--font-title); font-size: 1.8rem; margin-bottom: 15px; line-height: 1.2; }
        .card-desc { color: var(--text-dim); font-size: 0.9rem; line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .read-more { margin-top: 20px; color: #fff; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; border-bottom: 1px solid var(--gold); display: inline-block; padding-bottom: 2px; }

        /* MODAL */
        .modal-wrap {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 5000; display: none;
            overflow-y: auto;
        }
        .modal-inner {
            max-width: 900px; margin: 50px auto; background: #111; padding: 50px;
            border: 1px solid #333; position: relative; box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }
        .close-btn {
            position: absolute; top: 20px; right: 20px; font-size: 2rem; color: var(--gold);
            cursor: pointer; line-height: 0.5;
        }
        .modal-text-content {
            font-family: 'Playfair Display', serif; font-size: 1.2rem; line-height: 2; color: #ddd; white-space: pre-wrap;
        }
        .modal-title { font-size: 3rem; color: var(--gold); margin-bottom: 30px; border-bottom: 1px solid #333; padding-bottom: 20px; }

        /* FOOTER */
        footer { text-align: center; padding: 40px; color: #555; border-top: 1px solid #222; }
    </style>
</head>
<body>

    <div id="intro-overlay">
        <div class="intro-title">KazBloom</div>
        <div class="intro-names">Жоба авторлары: Арнұр және Аружан</div>
        <button class="btn-start" onclick="enterArchive()">Мұрағатты ашу</button>
    </div>

    <header>
        <div class="logo">KAZ<span>BLOOM</span></div>
        <div style="color: #666;">v.2.0.24 (ULTIMATE)</div>
    </header>

    <section class="search-area">
        <h2 style="margin-bottom: 20px; font-family: var(--font-title); color: #fff;">ҰЛЫ ДАЛА ТҰЛҒАЛАРЫ</h2>
        <input type="text" class="search-box" id="searchInput" placeholder="Тұлғаны іздеу (Мысалы: Абай, Кенесары)..." onkeyup="filterData()">
        
        <div class="filters" id="filterContainer">

            <button class="filter-btn" onclick="setCategory('ALASH')">АЛАШ</button>
            <button class="filter-btn" onclick="setCategory('WRITER')">ЖАЗУШЫЛАР</button>
            <button class="filter-btn" onclick="setCategory('WW2')">СОҒЫС БАТЫРЛАРЫ</button>
            <button class="filter-btn" onclick="setCategory('SCIENCE')">ҒАЛЫМДАР</button>

    <main class="archive-container" id="gridDisplay"></main>

    <div id="modal" class="modal-wrap">

            <span class="close-btn" onclick="closeModal()">×</span>
            <div id="modalContent"></div>
        </div>
    </div>

    <footer>
        <p>&copy; 2024 KazBloom Project. All Rights Reserved.</p>
        <p>Arnurn & Aruzhan Production</p>
    </footer>

        /*
        ================================================================
        LOGIC
        ================================================================
        */
        
        function enterArchive() {
            document.getElementById('intro-overlay').style.transform = 'translateY(-100%)';
            renderGrid(fullDatabase);
        }

        let currentCategory = 'ALL';

        function setCategory(cat) {
            currentCategory = cat;
            
            // UI Update
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            if(cat === 'ALL') {
                renderGrid(fullDatabase);
            } else {
                const filtered = fullDatabase.filter(item => item.type === cat);
                renderGrid(filtered);
            }
        }

        function filterData() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = fullDatabase.filter(item => 
                item.name.toLowerCase().includes(query) || 
                item.desc.toLowerCase().includes(query)
            );
            renderGrid(filtered);
        }

        function renderGrid(data) {
            const container = document.getElementById('gridDisplay');
            container.innerHTML = '';

            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => openModal(item.id);

                card.innerHTML = `
                    <div class="card-cat">${getCategoryName(item.type)}</div>
                    <div class="card-name">${item.name}</div>
                    <div class="card-desc">${item.desc}</div>
                    <div class="read-more">Толығырақ</div>
                `;
                container.appendChild(card);
            });
        }

        function getCategoryName(type) {
            const map = {
                'KHAN': 'Хан', 'BATYR': 'Батыр', 'POET': 'Ақын', 
                'ALASH': 'Алаш Арысы', 'BI': 'Би / Жырау', 
                'WRITER': 'Жазушы', 'WW2': 'Соғыс Батыры', 'SCIENCE': 'Ғалым'
            };
            return map[type] || type;
        }

        function openModal(id) {
            const item = fullDatabase.find(x => x.id === id);
            const modal = document.getElementById('modal');
            const content = document.getElementById('modalContent');
            
            content.innerHTML = `
                <div class="modal-title">${item.name}</div>
                <div class="modal-text-content">
                    <strong>${item.desc}</strong>
                    <br><br>
                    <hr style="border:0; border-top:1px solid #333; margin: 20px 0;">
                    ${item.text}
                    <br><br>
                    <em style="color:#666; font-size: 0.9rem;">Бұл деректер KazBloom (Арнұр & Аружан) жобасы үшін жинақталған.</em>
                </div>
            `;
            modal.style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

    </script>
