<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KazBloom Infinite Archive | Arnur & Aruzhan</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700;900&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <style>
        /* ================================================================
           KAZBLOOM MEGA STYLESHEET (PART 1: RESET & CORE)
           ================================================================
        */
        :root {
            --kz-blue: #00afca; --kz-gold: #fec100; --bg: #030712;
            --card: #111827; --glass: rgba(255, 255, 255, 0.05);
            --transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }
        body {
            background-color: var(--bg); color: #f8fafc;
            font-family: 'Montserrat', sans-serif; overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* CUSTOM SCROLLBAR */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--kz-blue); border-radius: 10px; }

        /* HEADER & NAVIGATION */
        nav {
            position: fixed; top: 0; width: 100%; height: 90px;
            background: rgba(3, 7, 18, 0.8); backdrop-filter: blur(20px);
            z-index: 1000; border-bottom: 1px solid var(--glass);
            display: flex; align-items: center; justify-content: space-between; padding: 0 50px;
        }
        .logo { font-family: 'Playfair Display', serif; font-size: 2.2rem; font-weight: 900; color: var(--kz-blue); text-decoration: none; }
        .nav-controls { display: flex; gap: 20px; align-items: center; }
        
        .lang-toggle {
            display: flex; background: var(--glass); border-radius: 50px; padding: 5px;
        }
        .lang-btn {
            border: none; background: none; color: white; padding: 8px 20px;
            border-radius: 50px; cursor: pointer; font-weight: 600; font-size: 0.8rem;
            transition: var(--transition);
        }
        .lang-btn.active { background: var(--kz-gold); color: black; }

        /* HERO SECTION */
        .hero {
            height: 100vh; display: flex; flex-direction: column; justify-content: center;
            align-items: center; text-align: center; position: relative;
            background: radial-gradient(circle at center, rgba(0, 175, 202, 0.15) 0%, transparent 70%);
        }
        .hero h1 {
            font-family: 'Playfair Display', serif; font-size: clamp(3rem, 10vw, 8rem);
            line-height: 1.1; margin-bottom: 20px; color: white;
        }
        .hero span { color: var(--kz-blue); }
        .hero p { font-size: 1.2rem; letter-spacing: 8px; color: var(--kz-gold); text-transform: uppercase; }

        /* SEARCH ENGINE UI */
        .search-container {
            max-width: 1200px; margin: -100px auto 50px; position: relative; z-index: 10;
            padding: 0 20px;
        }
        .search-bar {
            width: 100%; padding: 30px 50px; background: var(--card);
            border-radius: 20px; border: 1px solid var(--glass); color: white;
            font-size: 1.5rem; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* GRID SYSTEM */
        .main-container { max-width: 1400px; margin: 0 auto; padding: 50px 20px; }
        .shelf-title {
            font-family: 'Playfair Display', serif; font-size: 3rem; margin-bottom: 40px;
            color: var(--kz-gold); display: flex; align-items: center; gap: 20px;
        }
        .shelf-title::after { content: ""; height: 2px; flex: 1; background: var(--glass); }

        .grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 30px; margin-bottom: 100px;
        }

        /* CARD DESIGN */
        .card {
            background: var(--card); border-radius: 24px; padding: 40px;
            border: 1px solid var(--glass); cursor: pointer; position: relative;
            overflow: hidden; transition: var(--transition);
        }
        .card::before {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, var(--kz-blue), transparent);
            opacity: 0; transition: var(--transition); z-index: 0;
        }
        .card:hover { transform: translateY(-10px) scale(1.02); border-color: var(--kz-blue); }
        .card:hover::before { opacity: 0.05; }
        .card * { position: relative; z-index: 1; }
        .card h3 { font-size: 1.8rem; color: white; margin-bottom: 10px; font-family: 'Playfair Display'; }
        .card .role { color: var(--kz-gold); text-transform: uppercase; font-size: 0.8rem; letter-spacing: 2px; font-weight: 700; }

        /* MODAL SYSTEM */
        .modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px);
            display: none; justify-content: center; align-items: center; z-index: 2000; padding: 20px;
        }
        .modal-content {
            background: var(--card); width: 100%; max-width: 1000px; max-height: 90vh;
            border-radius: 30px; border: 1px solid var(--kz-blue); overflow-y: auto; padding: 60px;
        }
        .modal-header h2 { font-family: 'Playfair Display'; font-size: 4rem; color: var(--kz-blue); }
        .info-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 40px; margin: 40px 0; border-top: 1px solid var(--glass); padding-top: 40px;
        }
        .info-box label { display: block; color: var(--kz-gold); font-size: 0.75rem; text-transform: uppercase; margin-bottom: 10px; }
        .info-box p { font-size: 1.2rem; font-weight: 500; }

        /* AI CHATBOT (CUSTOM LOGIC) */
        .bot-container {
            position: fixed; bottom: 40px; right: 40px; z-index: 1500;
        }
        .bot-toggle {
            width: 80px; height: 80px; background: var(--kz-blue); border-radius: 50%;
            display: flex; justify-content: center; align-items: center; cursor: pointer;
            box-shadow: 0 20px 40px rgba(0, 175, 202, 0.4); font-size: 2.5rem;
        }
        .chat-box {
            position: absolute; bottom: 100px; right: 0; width: 400px; height: 600px;
            background: #0f172a; border-radius: 24px; border: 1px solid var(--kz-blue);
            display: none; flex-direction: column; overflow: hidden;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }
        .chat-header { background: var(--kz-blue); padding: 25px; color: black; font-weight: 900; }
        .chat-msgs { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .msg { padding: 15px 20px; border-radius: 15px; max-width: 80%; line-height: 1.5; font-size: 0.9rem; }
        .msg.bot { background: var(--glass); align-self: flex-start; border-bottom-left-radius: 2px; }
        .msg.user { background: var(--kz-gold); color: black; align-self: flex-end; border-bottom-right-radius: 2px; font-weight: 600; }
        .chat-input { padding: 20px; display: flex; gap: 10px; background: #1e293b; }
        .chat-input input { flex: 1; background: transparent; border: 1px solid var(--glass); color: white; padding: 12px; border-radius: 10px; }

        /* ANIMATIONS */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .card { animation: fadeIn 0.8s ease backwards; }

        @media (max-width: 768px) {
            nav { padding: 0 20px; }
            .hero h1 { font-size: 3.5rem; }
            .modal-content { padding: 30px; }
            .chat-box { width: calc(100vw - 40px); }
        }
    </style>
</head>
<body>

<nav>
    <a href="#" class="logo">KazBloom</a>
    <div class="nav-controls">

    /* ================================================================
       KAZBLOOM LOGIC ENGINE (PART 3: FUNCTIONS)
       ================================================================
    */
    let currentLang = 'kz';

    function setLang(l) {
        currentLang = l;
        document.getElementById('kz-btn').classList.toggle('active', l === 'kz');
        document.getElementById('en-btn').classList.toggle('active', l === 'en');
        
        document.getElementById('hero-title').innerHTML = l === 'kz' ? 'Ұлы Дала <span>Тұлғалары</span>' : 'Figures of the <span>Great Steppe</span>';
        document.getElementById('search').placeholder = l === 'kz' ? 'Тұлғаны іздеу...' : 'Search figure...';
        
        render();
    }

    function render() {
        const container = document.getElementById('content-app');
        container.innerHTML = '';

        const categories = {
            khan: currentLang === 'kz' ? "Хандар" : "Khans",
            bi: currentLang === 'kz' ? "Билер" : "Bi's",
            writer: currentLang === 'kz' ? "Жазушылар" : "Writers",
            batyr: currentLang === 'kz' ? "Батырлар" : "Heroes",
            hero: currentLang === 'kz' ? "Басқа тұлғалар" : "Other figures"
        };

        for (let key in categories) {
            const shelfData = db.filter(p => p.type === key);
            if (shelfData.length === 0) continue;

            const shelf = document.createElement('div');
            shelf.innerHTML = `<h2 class="shelf-title">${categories[key]}</h2>`;
            const grid = document.createElement('div');
            grid.className = 'grid';

            shelfData.forEach(p => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => openModal(p.id);
                card.innerHTML = `
                    <div class="role">${currentLang === 'kz' ? p.r_kz : p.r_en}</div>
                    <h3>${currentLang === 'kz' ? p.n_kz : p.n_en}</h3>
                    <p style="opacity:0.5">${currentLang === 'kz' ? 'Толығырақ' : 'Read more'}</p>
                `;
                grid.appendChild(card);
            });

            shelf.appendChild(grid);
            container.appendChild(shelf);
        }
    }

    function openModal(id) {
        const p = db.find(x => x.id === id);
        const data = document.getElementById('modal-data');

            </div>
            <div class="info-grid">
                <div class="info-box"><label>${currentLang === 'kz' ? 'Туған жылы' : 'Birth'}</label><p>${currentLang === 'kz' ? p.b_kz : p.b_en}</p></div>
                <div class="info-box"><label>${currentLang === 'kz' ? 'Туған жері' : 'Place'}</label><p>${currentLang === 'kz' ? p.p_kz : p.p_en}</p></div>
                <div class="info-box"><label>${currentLang === 'kz' ? 'Әкесі' : 'Father'}</label><p>${p.f_kz}</p></div>
                <div class="info-box"><label>${currentLang === 'kz' ? 'Анасы' : 'Mother'}</label><p>${p.m_kz}</p></div>
            </div>
            <div style="margin-top:30px; font-size:1.4rem; line-height:1.8;">
                ${currentLang === 'kz' ? p.desc_kz : p.desc_en}
            </div>
        `;
        document.getElementById('modal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('modal').style.display = 'none'; }

    function handleSearch() {
        const val = document.getElementById('search').value.toLowerCase();
        const cards = document.querySelectorAll('.card');
        cards.forEach(c => {
            const h3 = c.querySelector('h3').innerText.toLowerCase();
            c.style.display = h3.includes(val) ? 'block' : 'none';
        });
    }

    // CUSTOM LOCAL AI ENGINE (NO KEY NEEDED)
    function toggleChat() {
        const box = document.getElementById('chat-box');
        box.style.display = box.style.display === 'flex' ? 'none' : 'flex';
    }

    function aiProcess() {
        const input = document.getElementById('ai-input');
        const msgs = document.getElementById('chat-msgs');
        const q = input.value.toLowerCase();
        if(!q) return;

        msgs.innerHTML += `<div class="msg user">${input.value}</div>`;
        input.value = "";

        // Поиск в базе данных
        let reply = currentLang === 'kz' ? "Кешіріңіз, бұл тұлға туралы базада мәлімет таппадым." : "Sorry, I couldn't find information about this figure.";
        
        db.forEach(p => {
            if(q.includes(p.n_kz.toLowerCase()) || q.includes(p.n_en.toLowerCase())) {
                reply = currentLang === 'kz' 
                    ? `${p.n_kz} — ${p.r_kz}. Ол ${p.b_kz} жылы ${p.p_kz} жерінде туған. ${p.desc_kz}`
                    : `${p.n_en} — ${p.r_en}. Born in ${p.b_en} in ${p.p_en}. ${p.desc_en}`;
            }
        });

        if(q.includes("сәлем") || q.includes("hello")) {
            reply = currentLang === 'kz' ? "Сәлем! Қай тұлға туралы білгіңіз келеді?" : "Hello! Which figure do you want to learn about?";
        }

        setTimeout(() => {
            msgs.innerHTML += `<div class="msg bot">${reply}</div>`;
            msgs.scrollTop = msgs.scrollHeight;
        }, 500);
    }

    render();
</script>

</body>
</html>
