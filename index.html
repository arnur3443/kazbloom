<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAZBLOOM: THE GRAND ARCHIVE OF KAZAKH LITERATURE</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100;0,400;0,700;0,900;1,400&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&display=swap" rel="stylesheet">

    <style>
        /* =========================================
           1. CORE SYSTEM STYLES (GLOBAL)
           =========================================
        */
        :root {
            --primary-blue: #00afca;
            --primary-gold: #fec100;
            --deep-black: #010409;
            --card-dark: #0d1117;
            --border-color: #30363d;
            --text-light: #e6edf3;
            --text-dim: #8b949e;
            --transition-smooth: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            outline: none;
        }

        body {
            background-color: var(--deep-black);
            color: var(--text-light);
            font-family: 'Montserrat', sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* =========================================
           2. NAVIGATION DESIGN
           =========================================
        */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 90px;
            background: rgba(1, 4, 9, 0.85);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border-color);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 6%;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .brand-logo {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--primary-blue);
            text-decoration: none;
            letter-spacing: -1px;
        }

        .brand-sub {
            font-size: 0.7rem;
            color: var(--primary-gold);
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 700;
        }

        .lang-switcher {
            display: flex;
            background: #161b22;
            padding: 5px;
            border-radius: 50px;
            border: 1px solid var(--border-color);
        }

        .lang-btn {
            background: transparent;
            border: none;
            color: var(--text-dim);
            padding: 8px 22px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.85rem;
            transition: var(--transition-smooth);
        }

        .lang-btn.active {
            background: var(--primary-gold);
            color: black;
        }

        /* =========================================
           3. HERO & SEARCH SECTION
           =========================================
        */
        .hero {
            padding-top: 180px;
            padding-bottom: 100px;
            text-align: center;
            background: radial-gradient(circle at 50% 50%, rgba(0, 175, 202, 0.1) 0%, transparent 50%);
        }

        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(3rem, 8vw, 6.5rem);
            margin-bottom: 20px;
            font-weight: 900;
        }

        .hero h1 span {
            color: var(--primary-blue);
            font-style: italic;
        }

        .search-wrapper {
            max-width: 800px;
            margin: 50px auto 0;
            position: relative;
        }

        .search-input {
            width: 100%;
            background: var(--card-dark);
            border: 2px solid var(--border-color);
            padding: 25px 40px;
            border-radius: 100px;
            color: white;
            font-size: 1.2rem;
            transition: var(--transition-smooth);
        }

        .search-input:focus {
            border-color: var(--primary-blue);
            box-shadow: 0 0 30px rgba(0, 175, 202, 0.2);
        }

        /* =========================================
           4. DATA GRID & CARDS
           =========================================
        */
        .main-content {
            padding: 0 6% 100px;
        }

        .category-section {
            margin-bottom: 80px;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 40px;
        }

        .section-header h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            color: var(--primary-gold);
        }

        .section-line {
            height: 1px;
            flex-grow: 1;
            background: var(--border-color);
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
        }

        .person-card {
            background: var(--card-dark);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 45px;
            cursor: pointer;
            transition: var(--transition-smooth);
            position: relative;
            overflow: hidden;
        }

        .person-card:hover {
            transform: translateY(-15px);
            border-color: var(--primary-blue);
            background: #161b22;
        }

        .person-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 5px;
            height: 100%;
            background: var(--primary-blue);
            opacity: 0;
            transition: var(--transition-smooth);
        }

        .person-card:hover::before {
            opacity: 1;
        }

        .person-card .tag {
            color: var(--primary-gold);
            font-weight: 800;
            text-transform: uppercase;
            font-size: 0.7rem;
            letter-spacing: 3px;
            margin-bottom: 15px;
            display: block;
        }

        .person-card h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        /* =========================================
           5. MODAL & WORK VIEWER
           =========================================
        */
        .viewer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.98);
            z-index: 2000;
            display: none;
            overflow-y: auto;
        }

        .viewer-container {
            max-width: 1100px;
            margin: 50px auto;
            background: var(--card-dark);
            border-radius: 30px;
            min-height: 80vh;
            border: 1px solid var(--border-color);
            position: relative;
        }

        .viewer-nav {
            display: flex;
            border-bottom: 1px solid var(--border-color);
        }

        .nav-tab {
            flex: 1;
            padding: 25px;
            text-align: center;
            cursor: pointer;
            font-weight: 800;
            color: var(--text-dim);
            transition: var(--transition-smooth);
        }

        .nav-tab.active {
            color: var(--primary-gold);
            background: rgba(254, 193, 0, 0.05);
            border-bottom: 3px solid var(--primary-gold);
        }

        .viewer-content {
            padding: 60px;
        }

        .poem-block {
            margin-bottom: 60px;
            padding-left: 30px;
            border-left: 2px solid var(--primary-gold);
        }

        .poem-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            color: var(--primary-blue);
            margin-bottom: 25px;
        }

        .poem-text {
            white-space: pre-line;
            font-family: 'Playfair Display', serif;
            font-size: 1.25rem;
            line-height: 1.8;
            font-style: italic;
        }

        .close-viewer {
            position: absolute;
            top: -40px;
            right: 0;
            color: white;
            font-size: 2rem;
            cursor: pointer;
        }

        /* =========================================
           6. FOOTER
           =========================================
        */
        footer {
            padding: 100px 6%;
            border-top: 1px solid var(--border-color);
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <a href="#" class="brand-logo">KazBloom</a>
            <div class="brand-sub">Digital Archive</div>
        </div>
        <div class="lang-switcher">
            <button class="lang-btn active" id="kz-trigger" onclick="switchLanguage('kz')">KAZAKH</button>
            <button class="lang-btn" id="en-trigger" onclick="switchLanguage('en')">ENGLISH</button>
        </div>
    </header>

    <section class="hero">
        <h1 id="hero-text">Ұлы Дала <span>Мұрасы</span></h1>
        <div class="search-wrapper">
            <input type="text" class="search-input" id="search-box" placeholder="Тұлғаны немесе шығарманы іздеу..." onkeyup="filterContent()">
        </div>
    </section>

    <main class="main-content" id="app-grid">
        </main>

    <div class="viewer-overlay" id="viewer">
        <div class="viewer-container">
            <span class="close-viewer" onclick="closeViewer()">× ЖАБУ / CLOSE</span>
            <div class="viewer-nav">
                <div class="nav-tab active" id="tab-bio-btn" onclick="setTab('bio')">БИОГРАФИЯ / BIO</div>
                <div class="nav-tab" id="tab-works-btn" onclick="setTab('works')">ШЫҒАРМАЛАР / WORKS</div>
            </div>
            <div class="viewer-content" id="viewer-body">
                </div>
        </div>
    </div>

    <footer>
        <p style="color: var(--primary-gold); font-weight: 800; letter-spacing: 5px; margin-bottom: 20px;">ARNUR & ARUZHAN PROJECT</p>
        <p style="opacity: 0.5;">© 2026 KazBloom Platform. Built for Eternal Heritage.</p>
    </footer>

    <script>
        /* =========================================
           7. THE MASSIVE DATABASE (EXPANDED OBJECTS)
           =========================================
        */

        const big_db = [
            {
                id: 1001,
                category: "POET",
                name_kz: "Абай Құнанбайұлы",
                name_en: "Abai Kunanbayuly",
                role_kz: "Ұлы ақын, хәкім, философ",
                role_en: "Great Poet, Thinker, Philosopher",
                born: "1845",
                died: "1904",
                location_kz: "Семей облысы, Шыңғыстау",
                location_en: "Semey region, Chingistau",
                father: "Құнанбай Өскенбайұлы",
                mother: "Ұлжан",
                bio_kz: `Абай Құнанбайұлы — қазақтың ұлы ақыны, композитор, философ, қазақ жазба әдебиетінің негізін қалаушы және оның алғашқы классигі. Абайдың шынайы есімі — Ибраһим. Ол қазақ мәдениеті мен руханиятын жаңа деңгейге көтерді. Абай орыс және Еуропа мәдениетін жақын тану арқылы қазақ қоғамын оқу-білімге шақырды. Оның қара сөздері мен өлеңдері — қазақ философиясының шыңы.`,
                bio_en: `Abai Kunanbayuly was a great Kazakh poet, composer, philosopher, and the founder of Kazakh written literature. His real name was Ibrahim. Abai elevated Kazakh culture and spirituality to a new level. Through his deep knowledge of Russian and European literature, he urged the Kazakh society to pursue education and enlightenment. His "Book of Words" and poetry remain the peak of Kazakh philosophical thought.`,
                works_kz: [
                    {
                        title: "Ғылым таппай мақтанба",
                        content: `Ғылым таппай мақтанба,
                                  Орын таппай баптанба,
                                  Құмарланып шаттанба,
                                  Ойнап босқа күлуге.

                                  Бес нәрседен қашық бол,
                                  Бес нәрсеге асық бол,
                                  Адам болам десеңіз.
                                  Тілеуің, өмірің алдыңда,
                                  Тиісті соған үлес бер.

                                  Өсек, өтірік, мақтаншақ,
                                  Еріншек, бекер мал шашпақ –
                                  Бес дұшпаның, білсеңіз.
                                  Талап, еңбек, терең ой,
                                  Қанағат, рақым, ойлап қой –
                                  Бес асыл іс, көнсеңіз.`
                    },
                    {
                        title: "Сегіз аяқ",
                        content: `Алыстан сермеп,
                                  Жүректен тербеп,
                                  Шымырлап бойға жайылған.
                                  Қиуадан шауып,
                                  Қисынын тауып,
                                  Тағыны жетіп қайырған.
                                  Толғауы тоқсан қызыл тіл,
                                  Сөйлеймін десең, өзің біл.`
                    }
                ],
                works_en: [
                    {
                        title: "Be Boastful Not",
                        content: `Do not brag until you find science,
                                  Do not preen until you find your place,
                                  Do not rejoice in idle joy,
                                  In playing and laughing in vain.

                                  Flee from five things,
                                  Be eager for five things,
                                  If you want to be a human being.`
                    }
                ]
            },
            {
                id: 1002,
                category: "WRITER",
                name_kz: "Мұхтар Әуезов",
                name_en: "Mukhtar Auezov",
                role_kz: "Ұлы жазушы, драматург",
                role_en: "Great Writer, Playwright",
                born: "1897",
                died: "1961",
                location_kz: "Семей облысы, Бөрілі",
                location_en: "Semey region, Borili",
                father: "Омархан",
                mother: "Нұржамал",
                bio_kz: `Мұхтар Омарханұлы Әуезов — қазақтың ұлы жазушысы, қоғам қайраткері, филология ғылымдарының докторы, профессор. Оның "Абай жолы" роман-эпопеясы әлем әдебиетінің үздік шығармаларының бірі ретінде танылды. Әуезов қазақ драматургиясының негізін қалап, "Еңлік-Кебек" сияқты классикалық туындыларды дүниеге әкелді. Ол бүкіл саналы ғұмырын Абайтануға және қазақ әдебиетін әлемдік деңгейге шығаруға арнады.`,
                bio_en: `Mukhtar Omarhanuly Auezov was a great Kazakh writer, social activist, Doctor of Philology, and Professor. His epic novel "The Path of Abai" is recognized as one of the world's masterpieces of literature. Auezov founded Kazakh drama and created classic plays like "Enlik-Kebek." He dedicated his entire life to the study of Abai and bringing Kazakh literature to the international stage.`,
                works_kz: [
                    {
                        title: "Абай жолы (Романнан үзінді)",
                        content: `Құнанбай ауылы биылғы жазда өзгеше бір күйде. Шыңғыс сыртындағы Көкүйірім деген жерге қонған еді. Кешкі салқынмен бірге ауыл үстінен малдың даусы, қозы-лақтың маңырағаны естіледі. 
                                  Жас Абай биыл қаладан оқудан оралғалы бері көп өзгерген. Ол бұрынғыдай бала емес, ойлы, салмақты болып өскен. Оның көкірегінде кітаптан оқыған білім мен даланың кеңдігі тоғысып жатқандай.
                                  Әкесі Құнанбай оны ел істеріне баулымақшы болса да, Абайдың жаны әділдік пен ақиқатты іздейді. Оның алғашқы махаббаты — Тоғжанға деген сезімі де осы кезеңде бүршік жара бастаған еді.`
                    }
                ],
                works_en: [
                    {
                        title: "The Path of Abai (Fragment)",
                        content: `Kunanbay's village was in a unique state this summer. They had settled in a place called Kokuyirim. Along with the evening cool, the sounds of livestock could be heard over the village.
                                  Young Abai had changed much since returning from his studies in the city this year. He was no longer just a boy, but had grown thoughtful and serious. Within him, the knowledge from books and the vastness of the steppe seemed to merge.`
                    }
                ]
            },
            {
                id: 1003,
                category: "POET",
                name_kz: "Мағжан Жұмабаев",
                name_en: "Magzhan Zhumabayev",
                role_kz: "Алаш ақыны, педагог",
                role_en: "Alash Poet, Educator",
                born: "1893",
                died: "1938",
                location_kz: "Солтүстік Қазақстан",
                location_en: "North Kazakhstan",
                father: "Бекен",
                mother: "Гүлсім",
                bio_kz: `Мағжан Жұмабаев — қазақ әдебиетінің жарық жұлдызы, лирик ақын, Алаш қозғалысының қайраткері. Ол қазақ поэзиясына еуропалық үлгідегі символизм мен романтизмді алып келді. Мағжанның "Түркістан" өлеңі барша түркі жұртының рухын көтерген туынды болды. Өкінішке орай, сталиндік қуғын-сүргіннің құрбаны болып, атылып кетті, бірақ оның өлмес мұрасы халқымен бірге мәңгі жасайды.`,
                bio_en: `Magzhan Zhumabayev was a brilliant star of Kazakh literature, a lyric poet, and an activist of the Alash movement. He introduced European-style symbolism and romanticism to Kazakh poetry. His poem "Turkestan" inspired the spirit of all Turkic peoples. Unfortunately, he fell victim to Stalinist purges and was executed, but his immortal legacy lives on forever with his people.`,
                works_kz: [
                    {
                        title: "Мен жастарға сенемін",
                        content: `Арыстандай айбатты,
                                  Жолбарыстай қайратты –
                                  Қырандай күшті қанатты.
                                  Мен жастарға сенемін!

                                  Көздерінде от ойнар,
                                  Сөздерінде жалын бар,

                                  Қажымас қайрат, байсалды,

                ],
                works_en: [
                    {
                        title: "I Trust the Youth",
                        content: `With the majesty of a lion,
                                  With the energy of a tiger,

        // ГЕНЕРАЦИЯ 100+ ЗАПИСЕЙ ДЛЯ ОБЪЕМА (МЕН МҰНДА ЦИКЛ ҚОЛДАНАМЫН, БІРАҚ СЕН ӘРҚАЙСЫСЫН ЖЕКЕ ТОЛТЫРСАҢ БОЛАДЫ)
        for(let i=1; i<=100; i++) {
            big_db.push({
                id: 2000 + i,
                category: i % 2 === 0 ? "KHAN" : "BATYR",
                name_kz: `Тарихи тұлға №${i}`,
                name_en: `Historical Figure #${i}`,
                role_kz: "Ел қорғаған қайраткер",
                role_en: "Protector of the State",
                born: "XVIII-XIX ғ.",
                died: "XIX ғ.",
                location_kz: "Ұлы Дала",
                location_en: "Great Steppe",
                father: "Белгісіз",
                mother: "Белгісіз",
                bio_kz: "Бұл тұлға туралы тарихи деректер мен оның ел үшін істеген ерен еңбектері мұрағаттарда сақталған. Ол өз заманында халықтың бостандығы мен тәуелсіздігі үшін күрескен.",
                bio_en: "Historical records of this figure and their great deeds for the country are preserved in archives. They fought for the freedom and independence of the people in their time.",
                works_kz: [{ title: "Нақыл сөздері", content: "Ел ерімен, жер кенімен мағыналы.\nЕңбек етсең — емерсің." }],
                works_en: [{ title: "Proverbs", content: "The country is meaningful with its heroes." }]
            });
        }

        /* =========================================
           8. APPLICATION LOGIC
           =========================================
        */

        let currentLanguage = 'kz';
        let activePersonId = null;
        let activeTab = 'bio';

        function switchLanguage(lang) {
            currentLanguage = lang;
            document.getElementById('kz-trigger').classList.toggle('active', lang === 'kz');
            document.getElementById('en-trigger').classList.toggle('active', lang === 'en');
            
            // Hero texts
            document.getElementById('hero-text').innerHTML = lang === 'kz' ? 'Ұлы Дала <span>Мұрасы</span>' : 'Legacy of the <span>Great Steppe</span>';
            document.getElementById('search-box').placeholder = lang === 'kz' ? 'Тұлғаны немесе шығарманы іздеу...' : 'Search for figure or work...';
            
            renderCards();
        }

        function renderCards() {
            const grid = document.getElementById('app-grid');
            grid.innerHTML = '';

            const categories = {
                POET: currentLanguage === 'kz' ? "Ақындар" : "Poets",
                WRITER: currentLanguage === 'kz' ? "Жазушылар" : "Writers",
                KHAN: currentLanguage === 'kz' ? "Хандар" : "Khans",
                BATYR: currentLanguage === 'kz' ? "Батырлар" : "Batyrs"
            };

            for (const key in categories) {
                const section = document.createElement('section');
                section.className = 'category-section';
                
                section.innerHTML = `
                    <div class="section-header">
                        <h2>${categories[key]}</h2>
                        <div class="section-line"></div>
                    </div>
                `;

                const cardGrid = document.createElement('div');
                cardGrid.className = 'card-grid';

                const filtered = big_db.filter(p => p.category === key);
                
                filtered.forEach(p => {
                    const card = document.createElement('div');
                    card.className = 'person-card';
                    card.onclick = () => openViewer(p.id);
                    card.innerHTML = `
                        <span class="tag">${currentLanguage === 'kz' ? p.role_kz : p.role_en}</span>
                        <h3>${currentLanguage === 'kz' ? p.name_kz : p.name_en}</h3>
                        <p style="opacity: 0.6; font-size: 0.9rem;">${p.born} — ${p.died}</p>
                    `;
                    cardGrid.appendChild(card);
                });

                section.appendChild(cardGrid);
                grid.appendChild(section);
            }
        }

        function openViewer(id) {
            activePersonId = id;
            activeTab = 'bio';
            document.getElementById('viewer').style.display = 'block';
            document.body.style.overflow = 'hidden';
            updateViewer();
        }

        function closeViewer() {
            document.getElementById('viewer').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        function setTab(tab) {
            activeTab = tab;
            document.getElementById('tab-bio-btn').classList.toggle('active', tab === 'bio');
            document.getElementById('tab-works-btn').classList.toggle('active', tab === 'works');
            updateViewer();
        }

        function updateViewer() {
            const p = big_db.find(x => x.id === activePersonId);
            const body = document.getElementById('viewer-body');
            body.innerHTML = '';

            if (activeTab === 'bio') {
                body.innerHTML = `
                    <h1 style="font-family: 'Playfair Display'; font-size: 3.5rem; margin-bottom: 10px;">${currentLanguage === 'kz' ? p.name_kz : p.name_en}</h1>
                    <p style="color: var(--primary-gold); font-weight: 800; margin-bottom: 40px;">${currentLanguage === 'kz' ? p.role_kz : p.role_en}</p>
                    
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-bottom: 50px; background: #161b22; padding: 30px; border-radius: 20px;">
                        <div><small style="color: var(--primary-blue)">${currentLanguage === 'kz' ? 'ТУҒАН ЖЕРІ' : 'PLACE OF BIRTH'}</small><p>${currentLanguage === 'kz' ? p.location_kz : p.location_en}</p></div>
                        <div><small style="color: var(--primary-blue)">${currentLanguage === 'kz' ? 'УАҚЫТЫ' : 'YEARS'}</small><p>${p.born} - ${p.died}</p></div>
                        <div><small style="color: var(--primary-blue)">${currentLanguage === 'kz' ? 'ӘКЕСІ' : 'FATHER'}</small><p>${p.father}</p></div>
                        <div><small style="color: var(--primary-blue)">${currentLanguage === 'kz' ? 'АНАСЫ' : 'MOTHER'}</small><p>${p.mother}</p></div>
                    </div>

                    <div style="font-size: 1.3rem; line-height: 2;">
                        ${currentLanguage === 'kz' ? p.bio_kz : p.bio_en}
                    </div>
                `;
            } else {
                const works = currentLanguage === 'kz' ? p.works_kz : p.works_en;
                works.forEach(w => {
                    body.innerHTML += `
                        <div class="poem-block">
                            <h3 class="poem-title">${w.title}</h3>
                            <div class="poem-text">${w.content}</div>
                        </div>
                    `;
                });
            }
        }

        function filterContent() {
            const query = document.getElementById('search-box').value.toLowerCase();
            const cards = document.querySelectorAll('.person-card');
            cards.forEach(card => {
                const title = card.querySelector('h3').innerText.toLowerCase();
                card.style.display = title.includes(query) ? 'block' : 'none';
            });
        }

        // Initialize
        switchLanguage('kz');

    </script>
</body>
</html>
