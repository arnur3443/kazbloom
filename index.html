<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KazBloom — Digital Heritage Archive</title>
    <style>
        :root {
            --kz-blue: #00afca;
            --kz-gold: #fec100;
            --en-blue: #00247d;
            --bg: #fdfdfd;
        }

        body { font-family: 'Georgia', serif; background: var(--bg); margin: 0; color: #222; scroll-behavior: smooth; }
        header { background: var(--en-blue); color: white; padding: 60px 20px; text-align: center; border-bottom: 8px solid var(--kz-gold); }
        .authors { font-size: 1.2rem; margin-top: 15px; }
        .authors span { color: var(--kz-gold); font-weight: bold; }

        .container { max-width: 1100px; margin: 0 auto; padding: 40px 20px; }

        /* AI Search Section */
        .ai-engine { 
            background: #111; color: white; padding: 40px; border-radius: 20px; 
            margin-bottom: 60px; border: 2px solid var(--kz-gold); position: sticky; top: 20px; z-index: 100;
        }
        #ai-display { min-height: 100px; border-left: 4px solid var(--kz-gold); padding-left: 20px; margin-bottom: 20px; font-size: 1.1rem; line-height: 1.6; }
        .ai-form { display: flex; gap: 10px; }
        input { flex: 1; padding: 15px; border-radius: 8px; border: none; font-size: 1rem; }
        button { padding: 15px 30px; background: var(--kz-gold); border: none; border-radius: 8px; cursor: pointer; font-weight: bold; color: var(--en-blue); }

        /* FAQ Section */
        .faq-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .faq-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-top: 4px solid var(--kz-blue); }
        .faq-card h3 { color: var(--en-blue); font-size: 1.1rem; margin-top: 0; }
        .faq-card p { font-size: 0.95rem; color: #444; }

        h2.section-title { text-align: center; color: var(--en-blue); margin: 50px 0 30px; text-transform: uppercase; letter-spacing: 2px; }

        footer { text-align: center; padding: 40px; background: #eee; margin-top: 60px; font-size: 0.9rem; }
    </style>
</head>
<body>

<header>
    <div style="font-size: 0.8rem; letter-spacing: 2px;">ESTABLISHED 2025</div>
    <h1>KAZBLOOM DIGITAL ARCHIVE</h1>
    <div class="authors">Created by: <span>Khasenov Arnur</span> & <span>Adibay Aruzhan</span></div>
</header>

<div class="container">
    <section class="ai-engine">
        <h2 style="color: var(--kz-gold); margin-top: 0;">KazBloom Encyclopedia AI</h2>
        <div id="ai-display">Search for any figure (Abai, Ablai Khan, Alikhan, Makhambet, etc.)...</div>
        <div class="ai-form">
            <input type="text" id="ai-input" placeholder="Enter name (e.g. Abai, Shakarim, Mustafa)...">
            <button onclick="askAI()">Search / Іздеу</button>
        </div>
    </section>

    <h2 class="section-title">Cultural FAQ / Жиі қойылатын сұрақтар</h2>
    <div class="faq-grid" id="faq-container">
        </div>
</div>

<footer>
    © 2025 KazBloom Archive | Arnur & Aruzhan
</footer>

<script>
    const archive = {
        "abai": {
            kz: "Абай Құнанбайұлы (1845–1904) — қазақтың ұлы ақыны, ойшылы, ағартушысы. «Қара сөздері» — философиялық терең еңбек. Қазақ жазба әдебиетінің негізін салушы.",
            en: "Abai Qunanbaiuly (1845–1904) — The greatest Kazakh poet, philosopher, and educator. Founder of modern Kazakh literature. Known for 'Words of Edification'."
        },
        "shakarim": {
            kz: "Шәкәрім Құдайбердіұлы (1858–1931) — ақын, философ, тарихшы. Абайдың шәкірті. «Үш анық» еңбегінде адам өмірінің мәнін түсіндірді.",
            en: "Shakarim Qudayberdiuly (1858–1931) — Poet, philosopher, and historian. Disciple of Abai. Explored the meaning of life in his work 'Three Truths'."
        },
        "akhmet": {
            kz: "Ахмет Байтұрсынұлы (1872–1937) — ұлт ұстазы, лингвист, Алаш көсемі. Қазақ әліпбиін реформалап, тіл білімінің негізін қалады.",
            en: "Akhmet Baitursynuly (1872–1937) — National teacher, linguist, and leader of Alash. Reformed the Kazakh alphabet and established Kazakh linguistics."
        },
        "alikhan": {
            kz: "Әлихан Бөкейханов (1866–1937) — Алаш партиясының көсемі, Алаш Орда үкіметінің төрағасы. Қазақ автономиясы үшін күрескен мемлекет қайраткері.",
            en: "Alikhan Bokeikhanov (1866–1937) — Leader of the Alash movement and first Prime Minister of Alash Autonomy. Statesman and scholar."
        },
        "ablai": {
            kz: "Абылай хан (1711–1781) — ұлы қолбасшы, қазақ жерін біріктіруші. Ресей мен Қытай арасында көреген дипломатия жүргізді.",
            en: "Ablai Khan (1711–1781) — Great military leader who united Kazakh lands. A visionary diplomat between Russia and China."
        },
        "kenesary": {
            kz: "Кенесары Қасымұлы (1802–1847) — қазақтың соңғы ханы, ұлт-азаттық қозғалыстың жетекшісі. Мемлекеттілікті қалпына келтіруге ұмтылды.",
            en: "Kenesary Kasymuly (1802–1847) — The last Khan of the Kazakhs. Leader of the national liberation movement against colonial rule."
        }
        // ... Басқа тұлғаларды осы форматта қосуға болады
    };

    const faqs = [
        { q: "Қазақ мәдениеті дегеніміз не?", a: "Қазақ халқының ғасырлар бойы қалыптасқан тұрмыс-тіршілігі, салт-дәстүрі, тілі мен өнерінің жиынтығы." },
        { q: "Домбыраның маңызы қандай?", a: "Домбыра — ұлттық аспап, рухани символ. Күй — сөзсіз айтылған тарих деп есептеледі." },
        { q: "Неге қазақтар қонақжай?", a: "Көшпелі өмірде қонақ — Құдайдың қонағы саналған. Бұл өзара көмек пен сыйластықтың белгісі." }
    ];

    // FAQ-ты жүктеу
    const faqContainer = document.getElementById('faq-container');
    faqs.forEach(item => {
        faqContainer.innerHTML += `
            <div class="faq-card">
                <h3>${item.q}</h3>
                <p>${item.a}</p>
            </div>
        `;
    });

    function askAI() {
        const query = document.getElementById('ai-input').value.toLowerCase();
        const display = document.getElementById('ai-display');
        let found = false;

        for (let key in archive) {
            if (query.includes(key)) {
                display.innerHTML = `<strong>Қазақша:</strong> ${archive[key].kz}<br><br><strong>English:</strong> ${archive[key].en}`;
                found = true; break;
            }
        }
        if (!found) display.innerHTML = "Data not found. Try names like: Abai, Ablai, Alikhan, Akhmet...";
    }
</script>

</body>
</html>
