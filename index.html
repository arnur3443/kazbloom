<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAZBLOOM: ARNUR & ARUZHAN PROJECT</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Montserrat:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        /* ==========================================================================
           1. CSS RESET & VARIABLES (EXPANDED FOR CLARITY)
           ==========================================================================
        */
        :root {
            --gold: #D4AF37;
            --gold-glow: rgba(212, 175, 55, 0.4);
            --dark-bg: #0a0b10;
            --card-bg: #14161f;
            --text-main: #ffffff;
            --text-muted: #8b9bb4;
            --blue-accent: #3b82f6;
            --font-head: 'Playfair Display', serif;
            --font-body: 'Montserrat', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-main);
            font-family: var(--font-body);
            line-height: 1.7;
            overflow-x: hidden;
        }

        ::-webkit-scrollbar {
            width: 10px;
        }
        ::-webkit-scrollbar-track {
            background: var(--dark-bg);
        }
        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 5px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--gold);
        }

        /* ==========================================================================
           2. WELCOME OVERLAY (ARNUR & ARUZHAN)
           ==========================================================================
        */
        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: radial-gradient(circle at center, #1a1f2e 0%, #000000 100%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            transition: opacity 1.5s ease-in-out, visibility 1.5s;
        }

        .welcome-content h1 {
            font-family: var(--font-head);
            font-size: 4.5rem;
            color: var(--gold);
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 5px;
            animation: fadeInDown 1.5s ease;
        }

        .welcome-content h2 {
            font-family: var(--font-body);
            font-size: 1.5rem;
            color: var(--text-muted);
            font-weight: 300;
            letter-spacing: 10px;
            margin-bottom: 50px;
            animation: fadeInUp 1.5s ease;
        }

        .enter-btn {
            padding: 20px 60px;
            font-size: 1.2rem;
            background: transparent;
            border: 2px solid var(--gold);
            color: var(--gold);
            border-radius: 50px;
            cursor: pointer;
            font-weight: 800;
            transition: 0.4s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .enter-btn:hover {
            background: var(--gold);
            color: #000;
            box-shadow: 0 0 40px var(--gold-glow);
            transform: translateY(-5px);
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ==========================================================================
           3. HEADER & NAVIGATION
           ==========================================================================
        */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 20px 5%;
            background: rgba(10, 11, 16, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
        }

        .logo {
            font-family: var(--font-head);
            font-size: 1.8rem;
            font-weight: 900;
            color: #fff;
        }
        .logo span { color: var(--gold); }

        .lang-control button {
            background: none;
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            padding: 8px 16px;
            margin-left: 10px;
            cursor: pointer;
            transition: 0.3s;
        }
        .lang-control button.active, .lang-control button:hover {
            background: var(--gold);
            color: #000;
            border-color: var(--gold);
        }

        /* ==========================================================================
           4. SEARCH & HERO AREA
           ==========================================================================
        */
        .hero {
            margin-top: 120px;
            padding: 50px 5%;
            text-align: center;
        }

        .search-wrapper {
            position: relative;
            max-width: 800px;
            margin: 0 auto;
        }

        .main-search {
            width: 100%;
            padding: 25px 30px;
            font-size: 1.2rem;
            background: var(--card-bg);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 100px;
            color: #fff;
            transition: 0.3s;
        }

        .main-search:focus {
            border-color: var(--blue-accent);
            outline: none;
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.3);
        }

        /* ==========================================================================
           5. GRID LAYOUT
           ==========================================================================
        */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 40px;
            padding: 50px 5%;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 40px;
            border-radius: 20px;
            transition: 0.4s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 4px; height: 100%;
            background: var(--gold);
            opacity: 0;
            transition: 0.4s;
        }

        .card:hover {
            transform: translateY(-10px);
            background: #1a1d29;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .card:hover::before { opacity: 1; }

        .card-tag {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--blue-accent);
            margin-bottom: 15px;
            font-weight: 700;
        }

        .card h3 {
            font-family: var(--font-head);
            font-size: 2rem;
            margin-bottom: 15px;
            color: #fff;
        }

        .card p {
            color: var(--text-muted);
            font-size: 0.95rem;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* ==========================================================================
           6. FULL SCREEN MODAL (READING MODE)
           ==========================================================================
        */
        .modal {
            position: fixed; inset: 0;
            background: #000;
            z-index: 5000;
            display: none;
            overflow-y: auto;
            animation: fadeIn 0.3s ease;
        }

        .modal-content {
            max-width: 900px;
            margin: 0 auto;
            padding: 80px 20px;
        }

        .close-modal {
            position: fixed; top: 30px; right: 40px;
            font-size: 3rem; color: var(--gold);
            cursor: pointer; z-index: 5001;
            transition: 0.3s;
        }
        .close-modal:hover { transform: rotate(90deg); }

        .full-work-container {
            margin-top: 50px;
            background: #111;
            padding: 50px;
            border-radius: 10px;
            border-left: 5px solid var(--gold);
        }

        /* МАҢЫЗДЫ: Бұл стиль өлеңдердің құрылымын бұзбай көрсетеді */
        .full-text {
            white-space: pre-wrap; 
            font-family: 'Playfair Display', serif;
            font-size: 1.3rem;
            color: #e0e0e0;
            line-height: 2;
        }

        /* ==========================================================================
           7. AI BOT INTERFACE
           ==========================================================================
        */
        .bot-icon {
            position: fixed; bottom: 40px; right: 40px;
            width: 70px; height: 70px;
            background: var(--blue-accent);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 2rem; cursor: pointer;
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.5);
            z-index: 6000; transition: 0.3s;
        }
        .bot-icon:hover { transform: scale(1.1); }

        .chat-container {
            position: fixed; bottom: 120px; right: 40px;
            width: 400px; height: 600px;
            background: #1e2433;
            border: 1px solid #333;
            border-radius: 20px;
            display: none; flex-direction: column;
            overflow: hidden; z-index: 6000;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .chat-header {
            padding: 20px; background: var(--blue-accent);
            color: white; font-weight: 700;
        }

        .chat-body {
            flex: 1; padding: 20px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 15px;
        }

        .msg {
            padding: 12px 18px; border-radius: 15px;
            max-width: 85%; font-size: 0.9rem;
        }
        .bot-msg { background: rgba(255,255,255,0.1); align-self: flex-start; }
        .user-msg { background: var(--gold); color: black; align-self: flex-end; }

        .chat-footer {
            padding: 20px; border-top: 1px solid #333;
            display: flex; gap: 10px;
        }
        .chat-footer input {
            flex: 1; padding: 12px; border-radius: 8px;
            border: none; background: #111; color: white;
        }
    </style>
</head>
<body>

    <div id="welcome-screen">
        <div class="welcome-content">
            <h1>ҚОШ КЕЛДІҢІЗ!</h1>
            <h2>KAZBLOOM — АРНҰР МЕН АРУЖАННЫҢ ЖОБАСЫ</h2>
            <p style="color: #666; margin-bottom: 30px;">БАСУ АРҚЫЛЫ ТАРИХҚА ЕНІҢІЗ</p>
            <button class="enter-btn" onclick="startJourney()">БАСТАУ / START</button>
        </div>
    </div>

    <header>
        <div class="logo">KazBloom <span>Archive</span></div>
        <div class="lang-control">
            <button onclick="setLang('kz')" class="active">KZ</button>
            <button onclick="setLang('en')">EN</button>
        </div>
    </header>

    <div class="hero">
        <div class="search-wrapper">
            <input type="text" class="main-search" id="searchInp" placeholder="Тұлғаны іздеңіз (Мысалы: Абай, Махамбет)..." onkeyup="doSearch()">
        </div>
    </div>

    <div class="grid-container" id="grid"></div>

    <div class="modal" id="readModal">
        <div class="close-modal" onclick="closeRead()">×</div>
        <div class="modal-content" id="modalData"></div>
    </div>

    <div class="bot-icon" onclick="toggleChat()">🤖</div>
    <div class="chat-container" id="chatWindow">
        <div class="chat-header">KAZBLOOM AI</div>
        <div class="chat-body" id="chatBody">
            <div class="msg bot-msg">Сәлем! Менде Абайдың қара сөздері, батырлардың жырлары толық сақталған. Кімді оқығыңыз келеді?</div>
        </div>
        <div class="chat-footer">
            <input type="text" id="chatInput" placeholder="Сұраңыз...">
            <button onclick="sendMessage()" style="padding: 10px; background: var(--gold); border: none; cursor: pointer; border-radius: 5px;">OK</button>
        </div>
    </div>

    <script>
        /*
           ==========================================================================
           MASSIVE DATASTORE (FULL TEXTS)
           Мұнда мен шынымен ұзын мәтіндерді енгіземін.
           ==========================================================================
        */
        const library = [
            {
                id: 1,
                cat: "POET / PHILOSOPHER",
                name_kz: "Абай Құнанбайұлы",
                name_en: "Abai Kunanbayuly",
                desc_kz: "Қазақтың бас ақыны. Мұнда оның 'Қара сөздері' мен әйгілі өлеңдері толық берілген.",
                desc_en: "The main poet of the Kazakhs. Full Book of Words and poems.",
                full_text_kz: `
АБАЙДЫҢ БІРІНШІ ҚАРА СӨЗІ:

Бұл жасқа келгенше жақсы өткіздік пе, жаман өткіздік пе, әйтеуір бірталай өмірді өткіздік: алыстық, жұлыстық, айтыстық, тартыстық - әурешілікті көре-көре келдік. Енді жер ортасы жасқа келдік: қажыдық, жалықтық; қылып жүрген ісіміздің баяны жоқ, байлауы жоқ бір түрлі қоршылық өмір екенін білдік.

Ал, енді қалған өмірімізді қайтіп, не қылып өткіземіз? Соны таба алмай өзім де қайранмын.

Ел бағу? Жоқ, елге бағым жоқ. Бағусыз дертке ұшырайын деген кісі бақпаса, не албыртқан, көңілі басылмаған жастар бағамын демесе, бізді құдай сақтасын!

Мал бағу? Жоқ, баға алмаймын. Балалар өздеріне керегінше өздері бақсын. Жасымда алдауға түскенімді қойып, енді қартайғанда қызық берер деп алдауға түсейін бе?

Ғылым бағу? Жоқ, ғылым бағарға да ғылым сөзін сөйлесер адам жоқ. Білгеніңді кімге үйретерсің, білмегеніңді кімнен сұрарсың? Елсіз-күнсіз де кездемені жайып салып, қолына кезін алып отырғанның несі қызық? Мұңдасып шер тарқатысар кісі болмаған соң, ғылым өзі - бір тез қартайтатұғын күйік.

Софылық қылып, дін бағу? Жоқ, ол да болмайды, оған да тыныштық керек. Не көңілде, не көрген күнде бір тыныштық жоқ, осы елде, осы жерде не қылған софылық?

Балаларды бағу? Жоқ, баға алмаймын. Бағар едім, қалайша бағудың мәнісін де білмеймін, не болсын деп бағам, қай елге қосайын, қай әрекетке жұмсайын? Балаларымның өзіне ілгері өмірінің, білімінің пайдасын тыныштықпен көрерлік орын тапқаным жоқ, қайда бар, не қыл дерімді біле алмай отырмын, не бол деп бағам? Оны да ермек қыла алмадым.

Ақыры ойладым: осы ойыма келген нәрселерді қағазға жаза берейін, ақ қағаз бен қара сияны ермек қылайын, жиылып қалса, еімдегі кім де болса оқып тамашалар, болмаса артыма сөз қалсын дедім де, осы жазуға кірістім. Енді мұнан басқа ешбір жұмысым жоқ.

---

ҒЫЛЫМ ТАППАЙ МАҚТАНБА (ТОЛЫҚ НҰСҚА):

Ғылым таппай мақтанба,
Орын таппай баптанба,
Құмарланып шаттанба,
Ойнап босқа күлуге.
Бес нәрседен қашық бол,
Бес нәрсеге асық бол,
Адам болам десеңіз.
Тілеуің, өмірің алдыңда,
Оған қайғы жесеңіз.
Өсек, өтірік, мақтаншақ,
Еріншек, бекер мал шашпақ –
Бес дұшпаның, білсеңіз.
Талап, еңбек, терең ой,
Қанағат, рақым, ойлап қой –
Бес асыл іс, көнсеңіз.
Жамандық көрсең нәфрәтлі,
Суытып көңіл тыйсаңыз.
Жақсылық көрсең ғибрәтлі,
Оны ойға жисаңыз.
Ғалым болмай немене,
Балалықты қисаңыз?
Әвильде Алла бар делік,
Жоқ емес, бірақ бар делік.
Барлығына шүбә жоқ,
Мин кәмали кәр делік.
Алланың өзі де рас, сөзі де рас,
Рас сөз ешқашанда жалған болмас.
Көп кітап келді Алладан, оның төрті,
Алланы танытуға сөз айырмас.
                `,
                full_text_en: `
ABAI'S FIRST WORD (FULL TRANSLATION):

Did we live well or badly until this age? Regardless, we have passed a considerable life: we struggled, argued, contended, and saw much trouble. Now we have reached middle age: we are tired, bored; we realized that our actions have no permanence, no conclusion, and that life is a kind of humiliation.

How shall we spend the rest of our lives? I am baffled and cannot find the answer.

Rule the people? No, I have no luck with the people. Unless one wishes to catch an incurable disease, or unless an ardent young man wishes to try, God save us from it!

Herd livestock? No, I cannot. Let the children herd for their needs. Should I, who was deceived in my youth, be deceived again in my old age hoping for joy from it?

Pursue science? No, there is no one to discuss science with. To whom will you teach what you know, from whom will you ask what you don't? What is the joy of sitting with a yardstick in a desolate place? Without a soulmate to share sorrows, science itself is a grief that ages one quickly.

Practice Sufism and religion? No, that won't do either; it requires peace. There is no peace in the soul or in life here; what Sufism can there be in this land?

Raise children? No, I cannot. I would, but I don't know how or for what purpose. To what people should I join them, to what action should I direct them? I haven't found a place where they can peacefully enjoy the benefits of their future life and knowledge; I don't know where to send them or what to tell them to be. I couldn't make that an amusement either.

Finally, I decided: I will write down whatever comes to my mind, making amusement of white paper and black ink. If anyone reads and enjoys it, let them; if not, let the words remain behind me. So I began this writing. I have no other work now.
                `
            },
            {
                id: 2,
                cat: "POET / ACTIVIST",
                name_kz: "Махамбет Өтемісұлы",
                name_en: "Makhambet Otemisuly",
                desc_kz: "Исатай бастаған көтерілістің жалынды ақыны. Оның жырлары — рухтың дауысы.",
                desc_en: "The fiery poet of the uprising. His poems are the voice of the spirit.",
                full_text_kz: `
ЕРЕУІЛ АТҚА ЕР САЛМАЙ (ТОЛЫҚ НҰСҚА):

Ереуіл атқа ер салмай,
Егеулі найза қолға алмай,
Еңку-еңку жер шалмай,
Қоңыр салқын төске алмай,
Тебінгі терге шірімей,
Терлігі майдай ерімей,
Алты малта ас болмай,
Өз-өзіңнен жат болмай,
Түн қатып жүріп, түс қашпай,
Тебінгі теріс тақынбай,
Темір қазық жастанбай,
Қу толағай бастанбай,
Ерлердің ісі бітер ме?

Мұнар да мұнар, мұнар күн,
Бұлттан шыққан шұбар күн.
Буыршын мұзға тайған күн,
Бура атанға шөккен күн,
Бұлықсып жүрген ерлерден
Бұрынғы бақ-дәулет тайған күн.

Айналайын Ақ Жайық,
Ат салмай өтер күн қайда?
Еңсесі биік боз орда,
Еңкеймей кірер күн қайда?
Қара қазан, сары бала
Қамы үшін қылыш сермедік.
Ханнан қырық туғанша,
Қарадан туған бір бала
Халыққа жақса, сол артық!

БАЙМАҒАНБЕТ СҰЛТАНҒА АЙТҚАНЫ:

Хан емессің, қасқырсың,
Қас албасты басқырсың!
Достарың келіп табалап,
Дұшпаның сені басқа ұрсын!
Хан емессің, ылаңсың,
Қара шұбар жылансың.
Хан емессің, аярсың,
Айыр құйрық шаянсың!
                `,
                full_text_en: `
UNTIL WE SADDLE THE WARHORSE (FULL VERSION):

Until we saddle the warhorse,
